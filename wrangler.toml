name = "nyt-redirect"
main = "src/index.js"
compatibility_date = "2026-11-21"
[[routes]]
pattern = "nyt.nitinkhanna.com"
custom_domain = true
[observability.logs]
enabled = true
invocation_logs = true
persist = true

[[r2_buckets]]
binding = "PDF_CACHE"
bucket_name = "nyt-redirector-bucket"

[triggers]
crons = ["0 11 * * *" , "0 13 * * *"]   # UTC; NYT publishes the PDF early morning ET ; run twice a day in case NYT hasn't published yet
